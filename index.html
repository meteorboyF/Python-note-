<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyNotes — Python, Baked Fresh</title>
<meta name="description" content="Python notes from zero to boss: concepts, tricks, traps, practice problems and a step-by-step code visualiser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23D9A35F'/><circle cx='22' cy='24' r='5' fill='%235A3825'/><circle cx='40' cy='20' r='4' fill='%235A3825'/><circle cx='38' cy='40' r='5' fill='%23B3261E'/><circle cx='22' cy='42' r='4' fill='%235A3825'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=5">
<script>
  try { const t = localStorage.getItem('pn-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
  <a class="brand" href="#/">
    <span class="cookie-logo" aria-hidden="true"></span>
    <span>Py<b>Notes</b></span>
  </a>
  <div class="search">
    <input id="searchInput" type="search" placeholder="Search topics, problems, terms…  ( / )" autocomplete="off" aria-label="Search">
    <div class="search-results" id="searchResults" hidden></div>
  </div>
  <nav class="top-links">
    <a href="#/glossary">Glossary</a>
    <a href="#/playground">Visualiser</a>
  </nav>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="app" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden></div>

<!-- visualiser overlay -->
<div class="viz-overlay" id="viz" hidden>
  <div class="viz-shell" role="dialog" aria-label="Step-by-step code visualiser">
    <div class="viz-head">
      <strong>Step-by-step Visualiser</strong>
      <span class="viz-status" id="vizStatus"></span>
      <button class="btn ghost small" id="vizEdit">✎ Edit code</button>
      <button class="icon-btn" id="vizClose" aria-label="Close visualiser">✕</button>
    </div>
    <div class="viz-body" id="vizBody"></div>
  </div>
</div>

<div class="tooltip" id="tooltip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/marked@18.2.0/lib/marked.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="assets/js/topics.js?v=5"></script>
<script src="assets/js/glossary.js?v=5"></script>
<script src="assets/js/markdown.js?v=5"></script>
<script src="assets/js/visualiser.js?v=5"></script>
<script src="assets/js/app.js?v=5"></script>
</body>
</html>
